# Hyperions MC — hyperionsmc.com
# Destino en el VPS: /etc/nginx/sites-available/hyperionsmc.conf
# Activar con:       ln -s /etc/nginx/sites-available/hyperionsmc.conf /etc/nginx/sites-enabled/
# (certbot añadirá después el bloque 443/TLS y la redirección automáticamente)

server {
    listen 80;
    listen [::]:80;
    server_name hyperionsmc.com www.hyperionsmc.com;

    root /var/www/hyperionsmc;
    index index.html;

    # --- Cabeceras de seguridad (equivalentes al _headers de Cloudflare Pages) ---
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://api.mcsrvstat.us; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Activar HSTS SOLO cuando HTTPS lleve unos días funcionando sin problemas:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Compresión ---
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # --- Caché de estáticos (ojo: no usar add_header aquí dentro,
    #     anularía las cabeceras de seguridad heredadas del server block) ---
    location ~* \.(woff2|svg|css|js)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
